# Every built-in section refuses an unknown or misspelled key at boot.
application:
  environment: !env APP_ENV, dev
  debug: !env APP_DEBUG, false

session:
  name: EXAMPLE_SESSION
  same_site: Lax

# Declaring a security key is a promise: build() refuses to boot unless a global
# middleware enforces it with the same value. See app/Kernel.php.
security:
  max_body_size: 1048576
  csrf:
    enabled: true
  headers:
    x_frame_options: DENY
    referrer_policy: same-origin

localization:
  locale: en
  timezone: UTC
